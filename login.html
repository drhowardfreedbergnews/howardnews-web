<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101626">
<title>Sign in · Howard’s News Desk</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; color: #f6f7ff; background: #101626; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: clamp(1rem, 4vw, 4rem); background: radial-gradient(ellipse at 72% 6%, #29396d 0, transparent 54%), #101626; }
  main { width: min(66rem, 100%); display: grid; grid-template-columns: 1.2fr 1fr; background: #171f33; border: 1px solid #8ca9fb40; border-radius: 1.75rem; overflow: hidden; box-shadow: 0 35px 90px #060917b0; }
  .cover { position: relative; isolation: isolate; overflow: hidden; min-height: 34rem; padding: clamp(1.5rem, 4vw, 3.5rem); display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(ellipse at 73% 39%, #3958ae 0%, #1b2b59 49%, #131c37 78%); }
  .cover::before { content: ""; position: absolute; z-index: -1; inset: 0; opacity: .35; background: linear-gradient(#86a2fb25 1px, transparent 1px), linear-gradient(90deg, #86a2fb25 1px, transparent 1px); background-size: 2rem 2rem; mask-image: radial-gradient(ellipse at 70% 46%, black, transparent 76%); }
  .mark { width: 3.15rem; aspect-ratio: 1; display: grid; place-items: center; background: #bff5e2; color: #141e36; border-radius: .85rem; font: 700 1.75rem Georgia, serif; }
  .globe { position: absolute; z-index: -1; width: min(70%, 21rem); aspect-ratio: 1; right: 9%; top: 12%; border: 1px solid #adcbffad; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #75a4ff 0%, #405baf 29%, #182953 65%, #101936 83%); box-shadow: inset -18px -16px 48px #0c143b, inset 9px 7px 34px #c1d6ff66, 0 0 68px #729aff62; }
  .globe::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, #c9e4ff 1px, transparent 1.7px) 0 0 / 7px 7px; opacity: .68; mask-image: radial-gradient(ellipse at 32% 24%, black, transparent 78%); }
  .globe::after { content: ""; position: absolute; inset: 31% -20%; border: 1px solid #bce6fb91; border-radius: 50%; transform: rotate(-26deg); box-shadow: 0 5px 10px #a4d5ff21; }
  h1 { font: 400 clamp(2.75rem, 5.5vw, 5rem)/.97 Georgia, serif; margin: 5rem 0 0; letter-spacing: -.055em; text-shadow: 0 6px 28px #0d1634; }
  h1 em { color: #bff5e2; }
  .sign-in { align-self: center; padding: clamp(1.5rem, 4vw, 3.4rem); }
  h2 { font: 400 clamp(2rem, 3vw, 2.75rem)/1.05 Georgia, serif; letter-spacing: -.035em; margin: 0 0 1.5rem; }
  form { display: grid; gap: 1rem; }
  label { display: grid; gap: .4rem; color: #dbe5ff; font-size: .9rem; font-weight: 650; }
  input, button { font: inherit; min-height: 3rem; border-radius: .65rem; }
  input { border: 1px solid #8ba1d76d; background: #10182b; padding: .6rem .8rem; color: #fff; min-width: 0; width: 100%; }
  button { border: 0; background: #bff5e2; color: #142036; padding: .6rem 1rem; font-weight: 750; cursor: pointer; }
  button:hover { background: #e0fff2; }
  :focus-visible { outline: 2px solid #a3ceff; outline-offset: 3px; }
  .login-error { color: #ffe5e8; background: #4c263d; border: 1px solid #b65f7b; padding: .65rem .8rem; border-radius: .5rem; margin: 0; }
  @media (max-width: 640px) { main { grid-template-columns: 1fr; border-radius: 1.1rem; } .cover { min-height: 12.5rem; } .globe { width: 11rem; right: 10%; top: -18%; } h1 { margin-top: 1rem; } }
</style>
</head>
<body>
<main>
  <section class="cover" aria-labelledby="brand-title">
    <div class="mark" aria-hidden="true">H</div>
    <div class="globe" aria-hidden="true"></div>
    <h1 id="brand-title">Howard’s<br>News <em>Desk.</em></h1>
  </section>
  <section class="sign-in" aria-labelledby="signin-title">
    <h2 id="signin-title">Sign in</h2>
    <form action="/login?next=__NEXT__" method="post">
      __ERROR__
      <label>Username<input name="username" autocomplete="username" autocapitalize="none" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in to News Desk</button>
    </form>
  </section>
</main>
</body>
</html>
